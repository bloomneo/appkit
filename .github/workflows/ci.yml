name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Doc-drift check
        run: npm run check:docs

      - name: README anchor check
        run: npm run check:anchors

      - name: Vitest
        run: npm run test:unit

  # Integration gates: every module claim exercised against its real backend.
  # These exist because `appkit-database` advertised SQLite support that could
  # never have worked, and nothing ever ran it. A claim nobody exercises is a
  # promise you have not kept.
  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Run integration gates
        env:
          APPKIT_TEST_REDIS_URL: redis://localhost:6379
          APPKIT_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/appkit_test
        run: npm run test:integration
